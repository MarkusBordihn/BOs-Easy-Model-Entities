name: Java CI with Gradle

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Decompiled Minecraft sources restored from the Actions cache failed to recompile (EntitySectionStorage.java:120),
      # while a fresh Mavenizer run on the same runner succeeded.
      - name: Remove restored Forge Mavenizer cache
        run: rm -rf ~/.gradle/caches/minecraftforge

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon
