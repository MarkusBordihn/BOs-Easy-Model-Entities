modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/MarkusBordihn/BOs-Easy-Model-Entities/issues"

[[mods]]
modId = "easy_model_entities"
version = "${file.jarVersion}"
displayName = "Easy Model Entities"
displayURL = "https://curseforge.com/minecraft/mc-mods/easy-model-entities"
authors = "Markus Bordihn"
description = '''Turn Blockbench models into simple Minecraft entities without writing Java code.'''
features = { java_version = "${java_version_range}" }

[[dependencies.easy_model_entities]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.easy_model_entities]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
