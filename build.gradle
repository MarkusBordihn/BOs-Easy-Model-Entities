plugins {
  id 'idea'
  id "org.jetbrains.gradle.plugin.idea-ext" version "1.3"
}

String ghostRefIndexPath = (findProperty('ghostRefIndex') ?: '').toString().trim()
File ghostRefScript = ghostRefIndexPath ? file(ghostRefIndexPath) : null
if (ghostRefScript?.isFile()) apply from: ghostRefScript

ext.ghostRefReleaseResourcesConfig = [
    sourceProjectPath: ':Common',
    resourceIncludes: [
        'assets/easy_model_entities_examples/**',
        'data/easy_model_entities_examples/**',
    ],
    requiredEntries: [
        'data/easy_model_entities/structure/gametest.3x3x3.nbt',
        'de/markusbordihn/easymodelentities/gametest/GameTestHelpers.class',
        'de/markusbordihn/easymodelentities/gametest/HostEntityGameTestCases.class',
    ],
    loaderRequiredEntries: [
        'de/markusbordihn/easymodelentities/gametest/SmokeTest.class',
    ],
    forbiddenManifestAttributes: ['Implementation-Timestamp'],
    archives: [
        [projectPath: ':Common', archiveTaskName: 'jar', buildTaskName: 'jar', loaderArchive: false],
        [projectPath: ':Fabric', archiveTaskName: 'jar', buildTaskName: 'jar', loaderArchive: true],
        [projectPath: ':Forge', archiveTaskName: 'jar', buildTaskName: 'jar', loaderArchive: true],
        [projectPath: ':NeoForge', archiveTaskName: 'jar', buildTaskName: 'jar', loaderArchive: true],
    ],
]

File ghostRefReleaseScript = ghostRefScript?.parentFile == null
    ? null
    : new File(ghostRefScript.parentFile, 'ghost-ref-release-resources.gradle')
if (ghostRefReleaseScript?.isFile()) apply from: ghostRefReleaseScript

def requireGhostRefReleaseTooling = tasks.register('requireGhostRefReleaseTooling') {
  group = 'publishing'
  description = 'Requires and verifies the private Ghost Reference Index release tooling.'
  if (rootProject.ext.has('ghostRefReleaseToolingLoaded')) {
    dependsOn 'fullCheck'
  }

  doLast {
    if (!rootProject.ext.has('ghostRefReleaseToolingLoaded')) {
      throw new GradleException(
          'Official publishing requires ghost-ref-release-resources.gradle from the Ghost Reference Index.')
    }
  }
}

subprojects {

  apply plugin: 'java'

  java.toolchain.languageVersion = JavaLanguageVersion.of(25)
  java.withSourcesJar()
  java.withJavadocJar()

  repositories {
    mavenCentral()
    maven {
      url = uri("https://www.cursemaven.com")
      content {
        includeGroup "curse.maven"
      }
    }
  }

  dependencies {
    configurations.configureEach {
      resolutionStrategy.force 'org.ow2.asm:asm:9.8'
      resolutionStrategy.force 'org.ow2.asm:asm-commons:9.8'
    }
  }

  tasks.register('wrapper', Wrapper) {
    gradleVersion = '9.7.1'
    distributionType = Wrapper.DistributionType.BIN
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
  }

  tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
  }

  tasks.withType(Javadoc).configureEach {
    enabled = false
  }

  tasks.matching { it.name == 'modrinth' || it.name == 'curseforge' }.configureEach {
    dependsOn rootProject.tasks.named('requireGhostRefReleaseTooling')
  }

  tasks.register("prepareKotlinBuildScriptModel") {}

  idea {
    module {
      downloadSources = true
      downloadJavadoc = true
    }
  }
}

tasks.register('gameTests') {
  group = 'verification'
  description = 'Runs Fabric, Forge and NeoForge game tests.'
  dependsOn ':Fabric:runGameTest', ':Forge:runGameTestServer', ':NeoForge:runGameTestServer'
}

tasks.register('fullCheck') {
  group = 'verification'
  description = 'Runs the standard checks and Fabric, Forge and NeoForge game tests.'
  dependsOn ':Common:check', ':Fabric:check', ':Forge:check', ':NeoForge:check', 'gameTests'
}

tasks.register('publishModrinth') {
  group = 'publishing'
  description = 'Publishes Forge, Fabric and NeoForge to Modrinth.'
  dependsOn ':Forge:modrinth', ':Fabric:modrinth', ':NeoForge:modrinth', requireGhostRefReleaseTooling
  mustRunAfter 'fullCheck'
}

tasks.register('publishDelay') {
  description = 'Pauses between Modrinth and CurseForge uploads so logs do not interfere.'
  mustRunAfter 'publishModrinth'
  doLast {
    println 'Waiting 5 seconds before CurseForge upload...'
    sleep(5000)
  }
}

tasks.register('publishCurseForge') {
  group = 'publishing'
  description = 'Publishes Forge, Fabric and NeoForge to CurseForge.'
  dependsOn ':Forge:curseforge', ':Fabric:curseforge', ':NeoForge:curseforge', requireGhostRefReleaseTooling
  mustRunAfter 'publishDelay'
}

tasks.register('publishMods') {
  group = 'publishing'
  description = 'Builds, runs full checks, then publishes to Modrinth and (after a 5s pause) CurseForge.'
  dependsOn 'fullCheck', 'publishModrinth', 'publishDelay', 'publishCurseForge'
}
