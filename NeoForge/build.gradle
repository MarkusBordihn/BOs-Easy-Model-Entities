plugins {
  id 'maven-publish'
  id 'net.neoforged.gradle.userdev' version '7.1.39'
  id 'net.darkhax.curseforgegradle' version '1.1.28'
  id 'nu.studer.credentials' version '3.0'
  id "com.modrinth.minotaur" version "2.+"
}

base {
  archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

if (file('src/main/resources/META-INF/accesstransformer.cfg').exists()) {
  minecraft.accessTransformers.file file('src/main/resources/META-INF/accesstransformer.cfg')
}

runs {
  configureEach {
    systemProperty 'forge.logging.markers', 'REGISTRIES'
    systemProperty 'forge.logging.console.level', 'debug'
    modSource project.sourceSets.main
  }

  client {
    systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    systemProperty "${project.mod_id}.gametest", 'true'
  }

  if (rootProject.findProperty('clientRuntimeTest')?.isAvailable()) {
    clientTest {
      configure('client')
      workingDirectory project.file('run/clienttest')
    }
  }

  server {
    systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    systemProperty "${project.mod_id}.gametest", 'true'
    programArgument '--nogui'
  }

  gameTestServer {
    systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    systemProperty "${project.mod_id}.gametest", 'true'
  }

  data {
    programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
  }
}

def neoForgeMinVersion = neoforge_min_version.toString()

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
  implementation "net.neoforged:neoforge:${project.neoforge_version}"
  compileOnly project(":Common")

  testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  if (rootProject.findProperty('clientRuntimeTest')?.isClientTestRun()) {
    runtimeOnly rootProject.clientRuntimeTest.toolkitCoordinate('neoforge')
  }
}

// NeoGradle compiles the game, but we don't want to add our common code to the game's code
Spec<Task> notNeoTask = { Task it -> !it.name.startsWith("neo") } as Spec<Task>

tasks.withType(JavaCompile).matching(notNeoTask).configureEach {
  source(project(":Common").sourceSets.main.allSource)
}

tasks.withType(Javadoc).matching(notNeoTask).configureEach {
  source(project(":Common").sourceSets.main.allJava)
}

tasks.named("sourcesJar", Jar) {
  from(project(":Common").sourceSets.main.allSource)
}

tasks.withType(ProcessResources).matching(notNeoTask).configureEach {
  from project(":Common").sourceSets.main.resources
  inputs.property "neoforge_min_version", neoForgeMinVersion
  filesMatching("META-INF/neoforge.mods.toml") {
    filter { line -> line.replace("@neoforge_min_version@", neoForgeMinVersion) }
  }
}

test {
  useJUnitPlatform()
}

// FML resolves ${file.jarVersion} to 0.0NONE without Implementation-Version, and 0.0NONE passes every
// dependency version range, so dependents could never enforce a minimum version.
tasks.named('jar', Jar).configure {
  manifest {
    attributes([
        "Specification-Title"   : "${project.mod_name}",
        "Specification-Vendor"  : "${project.vendor_name}",
        "Specification-Version" : "1",
        "Implementation-Title"  : project.name,
        "Implementation-Version": "${project.version}",
        "Implementation-Vendor" : "${project.mod_id}",
    ])
  }
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      artifactId base.archivesName.get()
      from components.java
    }
  }
  repositories {
    maven {
      url "file://" + System.getenv("local_maven")
    }
  }
}

if (project.hasProperty('curseforge_project_id') && project.curseforge_project_id) {
  tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Uploads to CurseForge'
    apiToken = "${credentials.forKey('curseforge_api_token')}"

    def mainFile = upload(project.curseforge_project_id, jar)
    mainFile.changelogType = 'markdown'
    mainFile.changelog = rootProject.file("CHANGELOG.md").text
    mainFile.releaseType = "${project.curseforge_release_type}"
    mainFile.addEnvironment("Client", "Server")
    mainFile.addModLoader('NeoForge')
    mainFile.addGameVersion("${project.minecraft_version}")
  }
}

if (project.hasProperty('modrinth_project_id') && project.modrinth_project_id) {
  modrinth {
    token = "${credentials.forKey('modrinth_api_token')}"
    projectId = "${project.modrinth_project_id}"
    versionNumber = "${project.version}"
    versionType = "${project.modrinth_release_type}"
    versionName = "${project.mod_name} ${project.version}"
    changelog = rootProject.file("CHANGELOG.md").text
    uploadFile = jar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ["neoforge"]
  }
}
